name: ci

# The checks the image build also runs, surfaced on the pull request so a
# missing term uid or a type error is a red check rather than a container
# that crash-loops after merge -- plus a check that the committed build
# outputs are current.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the packageManager field in package.json, the same
      # one the Dockerfile installs.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run check:uids
      - run: pnpm run bundle
      # The stylesheet and font subsets are build outputs that are committed
      # so a clone renders. Rebuild them and fail if the commit is stale or
      # if the build produced a file nobody committed (git diff alone would
      # miss an untracked font).
      - run: pnpm run build:assets
      - name: committed build outputs are current
        run: |
          drift=$(git status --porcelain -uall -- public src/ui/fonts.css)
          if [ -n "$drift" ]; then
            echo "Build outputs differ from the commit. Run 'pnpm run build:assets' and commit the result:"
            echo "$drift"
            exit 1
          fi
